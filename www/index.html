<!DOCTYPE html>
<html lang="en">
    <head>
        <title>The Go Clock</title>
        <meta charset="utf-8">
        <meta name="description" content="A static Go board clock that tells the time with stones.">
        <meta name="theme-color" content="#151515">
        <link rel="stylesheet" href="./my-clock.css">
        <script type="module" src="./my-clock.js"></script>
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">
        <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero, so the
             toolbar can keep clear of a notch. user-scalable=no is honoured
             by the iOS app's web view (no pinch or double-tap zoom on the board) and
             ignored by Safari, which always lets people zoom. -->
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
        <link rel="icon" href="images/white_stone1_160.png" type="image/png">
        <link rel="apple-touch-icon" href="images/touch-icon.png">
        <link rel="manifest" href="manifest.webmanifest">
    </head>
    <body>
        <div id="about_box" role="dialog" aria-labelledby="about-title" hidden>
            <h1 id="about-title">The <strong>Go</strong> Clock</h1>
            <p>The Go Clock is a virtual goban where the stones are used to tell you the time, saving you from the effort of
                setting up and continually updating your own Go board.</p>
            <p><span style="font-weight: bold;">Tip of the day:</span> <span id="tip_of_the_day"></span></p>
            <p class="about-meta"><span>&copy; 2014&ndash;2026 Scott Griffiths</span><span>Version <span id="version">2.0</span></span></p>
        </div>
        <div id="sb-site">
            <div id="toolbar" class="toolbar" role="toolbar" aria-label="Clock controls" data-collapsed="false">
                <!-- A row: first the button that tucks the rest away and
                     brings them back, then a button per setting, an icon each,
                     dropping its choices out (created by my-clock.js, which
                     also places them where they fit on the screen); only one
                     is open at a time. A button's accessible name is its setting
                     and current value ("Board: Oak"). Along the top of the screen
                     in portrait; down the left in landscape, where the board
                     leaves the sides free. The background has no button:
                     it is changed by swiping the surround. -->
                <button id="menu-toggle" class="button menu-toggle" type="button" title="Hide the controls" aria-label="Hide the controls" aria-expanded="true" aria-controls="toolbar-actions">
                    <span aria-hidden="true">✕</span>
                </button>
                <div id="toolbar-actions" class="toolbar-actions">
                    <div id="face-control" class="setting-control" data-open="false">
                        <button class="setting-summary" type="button" title="Face" aria-label="Face" aria-expanded="false" aria-controls="face-options">
                            <!-- Filled by my-clock.js with the icon of the face on the board. -->
                            <span class="setting-icon" aria-hidden="true"></span>
                        </button>
                        <div id="face-options" class="setting-options" role="group" aria-label="Face" hidden></div>
                    </div>
                    <div id="speed-control" class="setting-control" data-open="false">
                        <button class="setting-summary" type="button" title="Speed" aria-label="Speed" aria-expanded="false" aria-controls="speed-options">
                            <span class="setting-icon" aria-hidden="true">🐇</span>
                        </button>
                        <div id="speed-options" class="setting-options" role="group" aria-label="Speed" hidden></div>
                    </div>
                    <!-- Not a setting: a game replayed on the board (replay.js),
                         pressed while it runs. -->
                    <button id="replay" class="button replay-button" type="button" title="Replay a game" aria-label="Replay a game" aria-pressed="false">
                        <span class="setting-icon" aria-hidden="true">▶</span>
                    </button>
                    <!-- Under one button: two toggles, the 24-hour clock and
                         sound, which unlike a choice leave the list open; the
                         board's wood and the precision, each a submenu of
                         choices opening out beside the list; and the about
                         box. -->
                    <div id="settings-control" class="setting-control" data-open="false">
                        <button class="setting-summary" type="button" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="settings-options">
                            <span class="setting-icon" aria-hidden="true">⚙</span>
                        </button>
                        <div id="settings-options" class="setting-options" role="group" aria-label="Settings" hidden>
                            <button id="mode" class="choice-button" type="button" aria-pressed="true">24-hour clock</button>
                            <button id="mute" class="choice-button" type="button" aria-pressed="true">Sound</button>
                            <div id="wood-control" class="setting-control" data-open="false">
                                <button class="choice-button submenu-button" type="button" title="Board" aria-label="Board" aria-expanded="false" aria-controls="wood-options">
                                    <span aria-hidden="true">Board</span>
                                    <span class="setting-value" aria-hidden="true"></span>
                                </button>
                                <div id="wood-options" class="setting-options" role="group" aria-label="Board" hidden></div>
                            </div>
                            <div id="placement-control" class="setting-control" data-open="false">
                                <button class="choice-button submenu-button" type="button" title="Precision" aria-label="Precision" aria-expanded="false" aria-controls="placement-options">
                                    <span aria-hidden="true">Precision</span>
                                    <span class="setting-value" aria-hidden="true"></span>
                                </button>
                                <div id="placement-options" class="setting-options" role="group" aria-label="Precision" hidden></div>
                            </div>
                            <button id="about" class="choice-button" type="button" aria-expanded="false" aria-controls="about_box">About</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- What a key or the replay just chose, shown briefly at the foot of the screen. -->
            <div id="swipe-toast" class="setting-summary swipe-toast" role="status" aria-live="polite" hidden>
                <span id="swipe-toast-icon" class="setting-icon" aria-hidden="true"></span>
                <span id="swipe-toast-value"></span>
            </div>
            <!-- role="img": the stones mean nothing to a screen reader, so the
                 board is one picture, whose label my-clock.js keeps as the time. -->
            <div id="goban" role="img" aria-label="Go board clock">
                <img id="goban-image" alt="">
            </div>
        </div>
    </body>
</html>
