<!DOCTYPE html>
<html lang="en">
    <head>
        <title>The Go Clock</title>
        <meta charset="utf-8">
        <meta name="description" content="A static Go board clock that tells the time with stones.">
        <meta name="theme-color" content="#151515">
        <link rel="stylesheet" href="./my-clock.css">
        <script type="module" src="./my-clock.js"></script>
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="shortcut icon" href="images/white_stone1.png" type="image/x-icon">
        <link rel="apple-touch-icon" href="images/touch-icon.png">
        <link rel="manifest" href="manifest.webmanifest">
    </head>
    <body>
        <div id="about_box" role="dialog" aria-labelledby="about-title" hidden>
            <h1 id="about-title">The <strong>Go</strong> Clock</h1>
            <p>The Go Clock is a virtual goban where the stones are used to tell you the time, saving you from the effort of
                setting up and continually updating your own Go board.</p>
            <p><span style="font-weight: bold;">Tip of the day:</span> <span id="tip_of_the_day"></span></p>
            <p><a class="repo-link" href="https://github.com/scott-griffiths/go-clock">GitHub repository</a></p>
            <p class="about-meta"><span>&copy; 2016 Scott Griffiths</span><span>Version 1.3</span></p>
        </div>
        <div id="sb-site">
            <div id="toolbar" class="toolbar" role="toolbar" aria-label="Clock controls" data-visible="true">
                <button id="menu" class="button sidebar-button" type="button" title="Show sidebar" aria-label="Show sidebar" aria-controls="sidebar" aria-expanded="false">
                    <span class="sidebar-icon" aria-hidden="true"></span>
                </button>
                <button id="reset-board" class="button reset-button" type="button" title="Reset board" aria-label="Reset board">
                    <span aria-hidden="true">↙</span>
                </button>
                <button id="change-face" class="button setting-button" type="button" title="Change clock face" aria-label="Change clock face">
                    <span class="setting-icon" aria-hidden="true">◷</span>
                    <span id="change-face-label">Analogue</span>
                </button>
                <button id="change-background" class="button setting-button" type="button" title="Change background" aria-label="Change background">
                    <span class="setting-icon" aria-hidden="true">▧</span>
                    <span id="change-background-label">Dark wood</span>
                </button>
                <button id="change-speed" class="button setting-button" type="button" title="Change stone speed" aria-label="Change stone speed">
                    <span class="setting-icon" aria-hidden="true">≫</span>
                    <span id="change-speed-label">Normal</span>
                </button>
                <button id="change-placement" class="button setting-button" type="button" title="Change stone placement" aria-label="Change stone placement">
                    <span class="setting-icon" aria-hidden="true">⌖</span>
                    <span id="change-placement-label">Organic</span>
                </button>
            </div>
            <div id="goban" aria-label="Go board clock">
                <img id="goban-image" alt="">
            </div>
        </div>
        <aside id="sidebar" aria-label="Clock settings">
            <h2 id="menu-title">The <strong>Go</strong> Clock</h2>
            <nav>
                <ul class="sb-menu">
                    <li><button id="setting-wood" type="button">Board <span id="wood"></span></button></li>
                    <li><button id="setting-mode" type="button">Mode <span id="mode"></span></button></li>
                    <li><button id="about" type="button">About</button></li>
                </ul>
            </nav>
        </aside>
    </body>
</html>
