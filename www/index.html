<!DOCTYPE html>
<html lang="en">
    <head>
        <title>The Go Clock</title>
        <meta charset="utf-8">
        <meta name="description" content="A static Go board clock that tells the time with stones.">
        <meta name="theme-color" content="#151515">
        <link rel="stylesheet" href="./my-clock.css">
        <script type="module" src="./my-clock.js"></script>
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">
        <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero, so the
             toolbar can keep clear of a notch. user-scalable=no is honoured
             by the iOS app's web view (no pinch or double-tap zoom on the board) and
             ignored by Safari, which always lets people zoom. -->
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
        <link rel="icon" href="images/white_stone1_160.png" type="image/png">
        <link rel="apple-touch-icon" href="images/touch-icon.png">
        <link rel="manifest" href="manifest.webmanifest">
    </head>
    <body>
        <div id="about_box" role="dialog" aria-labelledby="about-title" hidden>
            <h1 id="about-title">The <strong>Go</strong> Clock</h1>
            <p>The Go Clock is a virtual goban where the stones are used to tell you the time, saving you from the effort of
                setting up and continually updating your own Go board.</p>
            <p><span style="font-weight: bold;">Tip of the day:</span> <span id="tip_of_the_day"></span></p>
            <p class="about-meta"><span>&copy; 2014&ndash;2026 Scott Griffiths</span><span>Version <span id="version">2.0</span></span></p>
        </div>
        <div id="sb-site">
            <div id="toolbar" class="toolbar" role="toolbar" aria-label="Clock controls" data-collapsed="false">
                <!-- A row: first the button that tucks the rest away and
                     brings them back, then a button per visual setting, an
                     icon each, dropping its choices out (created by
                     my-clock.js, which also places them where they fit on
                     the screen); only one is open at a time. A button's
                     accessible name is its setting and current value
                     ("Board: Oak"). The icons (icons.js) are filled in by
                     my-clock.js: a setting's is that of its choice.
                     Choosing a face, a speed, a background or a board
                     leaves the list open, rather than closing it as most
                     choices do, so several can be tried in a row. Set apart
                     by a gap at the row's end, the tools button, not a
                     visual setting itself but a flat list of its own kind
                     (a game replayed, the clock's hours and sound, its
                     precision, and about).
                     Along the top of the screen in portrait; down the left in
                     landscape, where the board leaves the sides free. -->
                <button id="menu-toggle" class="button menu-toggle" type="button" title="Hide the controls" aria-label="Hide the controls" aria-expanded="true" aria-controls="toolbar-actions">
                    <span aria-hidden="true"></span>
                </button>
                <div id="toolbar-actions" class="toolbar-actions">
                    <div id="face-control" class="setting-control" data-open="false">
                        <button class="setting-summary" type="button" title="Face" aria-label="Face" aria-expanded="false" aria-controls="face-options">
                            <span class="setting-icon" aria-hidden="true"></span>
                        </button>
                        <div id="face-options" class="setting-options" role="group" aria-label="Face"></div>
                    </div>
                    <div id="speed-control" class="setting-control" data-open="false">
                        <button class="setting-summary" type="button" title="Speed" aria-label="Speed" aria-expanded="false" aria-controls="speed-options">
                            <span class="setting-icon" aria-hidden="true"></span>
                        </button>
                        <div id="speed-options" class="setting-options" role="group" aria-label="Speed"></div>
                    </div>
                    <div id="background-control" class="setting-control" data-open="false">
                        <button class="setting-summary" type="button" title="Background" aria-label="Background" aria-expanded="false" aria-controls="background-options">
                            <span class="setting-icon" aria-hidden="true"></span>
                        </button>
                        <div id="background-options" class="setting-options" role="group" aria-label="Background"></div>
                    </div>
                    <div id="wood-control" class="setting-control" data-open="false">
                        <button class="setting-summary" type="button" title="Board" aria-label="Board" aria-expanded="false" aria-controls="wood-options">
                            <span class="setting-icon" aria-hidden="true"></span>
                        </button>
                        <div id="wood-options" class="setting-options" role="group" aria-label="Board"></div>
                    </div>
                    <!-- Not a visual setting, any of these: a game
                         replayed, the clock's hours and sound, and what the
                         clock is. Tucked under one "Tools" button, apart
                         from the visual choices above (a gap sets it apart
                         in the row), and flat as one list rather than a
                         setting buried in a setting, so each is a tap away
                         once the list is open, not two. -->
                    <div id="tools-control" class="setting-control" data-open="false">
                        <button class="setting-summary" type="button" title="Tools" aria-label="Tools" aria-expanded="false" aria-controls="tools-options">
                            <span class="setting-icon" aria-hidden="true"></span>
                        </button>
                        <div id="tools-options" class="setting-options" role="group" aria-label="Tools">
                            <!-- A game replayed on the board (replay.js).
                                 The button drops down the shelves of games
                                 to pick one from; while a game runs it is
                                 pressed instead, and stops it. Play, pause
                                 and the speed to play at sit next to the
                                 replay bar's own line, below, not here. -->
                            <div id="replay-control" class="setting-control" data-open="false">
                                <button id="replay" class="choice-button submenu-button submenu-with-icon" type="button" title="Replay a game" aria-label="Replay a game" aria-expanded="false" aria-controls="replay-options" aria-pressed="false">
                                    <span class="setting-icon" aria-hidden="true"></span>
                                    <span aria-hidden="true">Replay</span>
                                </button>
                                <div id="replay-options" class="setting-options" role="group" aria-label="Replay a game"></div>
                            </div>
                            <!-- The clock's hours, whether it shows seconds,
                                 and the sound, which unlike a choice leave
                                 the list open, each showing where it stands
                                 (in words, but for the sound, whose icon
                                 alone does) and swapping over when clicked. -->
                            <button id="mode" class="choice-button" type="button"></button>
                            <button id="seconds-toggle" class="choice-button" type="button"></button>
                            <button id="mute" class="choice-button choice-with-trailing-icon" type="button">
                                <span aria-hidden="true">Sound</span>
                                <span class="setting-icon" aria-hidden="true"></span>
                            </button>
                            <!-- The precision: a submenu of choices opening
                                 out beside the list. -->
                            <div id="placement-control" class="setting-control" data-open="false">
                                <button class="choice-button submenu-button submenu-with-icon" type="button" title="Precision" aria-label="Precision" aria-expanded="false" aria-controls="placement-options">
                                    <span class="setting-icon" aria-hidden="true"></span>
                                    <span aria-hidden="true">Precision</span>
                                    <span class="setting-value" aria-hidden="true"></span>
                                </button>
                                <div id="placement-options" class="setting-options" role="group" aria-label="Precision"></div>
                            </div>
                            <!-- What the clock is: opens the about box
                                 instead of a list. -->
                            <button id="about" class="choice-button choice-with-icon" type="button" aria-expanded="false" aria-controls="about_box">
                                <span class="setting-icon" aria-hidden="true"></span>
                                <span>About</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- What a key or the replay just chose, shown briefly at the foot of the screen. -->
            <div id="swipe-toast" class="setting-summary swipe-toast" role="status" aria-live="polite" hidden>
                <span id="swipe-toast-icon" class="setting-icon" aria-hidden="true"></span>
                <span id="swipe-toast-value"></span>
            </div>
            <!-- A game being replayed: play or pause, and the speed to play
                 at (a setting-control, like the hand's own), next to where
                 the game has got to, on a line from the first move to the
                 last, which can be dragged to any move. Under the board, or
                 beside it in landscape (my-clock.js places it); comes and
                 goes with the toolbar's own row when that is tucked away or
                 brought back. -->
            <div id="replay-bar" class="replay-bar" hidden>
                <div id="replay-speed-control" class="setting-control" data-open="false">
                    <button class="setting-summary" type="button" title="Playback speed" aria-label="Playback speed" aria-expanded="false" aria-controls="replay-speed-options">
                        <span class="setting-icon" aria-hidden="true"></span>
                    </button>
                    <div id="replay-speed-options" class="setting-options" role="group" aria-label="Playback speed"></div>
                </div>
                <div id="replay-track" class="replay-track" role="slider" tabindex="0" aria-label="Move" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
                    <div class="replay-line"></div>
                    <div id="replay-marker" class="replay-marker"></div>
                </div>
            </div>
            <!-- role="img": the stones mean nothing to a screen reader, so the
                 board is one picture, whose label my-clock.js keeps as the time. -->
            <div id="goban" role="img" aria-label="Go board clock">
                <img id="goban-image" alt="">
            </div>
        </div>
    </body>
</html>
