<!DOCTYPE html>
<html lang="en">
    <head>
        <title>The Go Clock</title>
        <meta charset="utf-8">
        <meta name="description" content="A static Go board clock that tells the time with stones.">
        <meta name="theme-color" content="#151515">
        <link rel="stylesheet" href="./my-clock.css">
        <script type="module" src="./my-clock.js"></script>
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">
        <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero, so the
             toolbar can keep clear of a notch. user-scalable=no is honoured
             by the iOS app's web view (no pinch or double-tap zoom on the board) and
             ignored by Safari, which always lets people zoom. -->
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
        <link rel="icon" href="images/white_stone1_160.png" type="image/png">
        <link rel="apple-touch-icon" href="images/touch-icon.png">
        <link rel="manifest" href="manifest.webmanifest">
    </head>
    <body>
        <div id="about_box" role="dialog" aria-labelledby="about-title" hidden>
            <h1 id="about-title">The <strong>Go</strong> Clock</h1>
            <p>The Go Clock is a virtual goban where the stones are used to tell you the time, saving you from the effort of
                setting up and continually updating your own Go board.</p>
            <p><span style="font-weight: bold;">Tip of the day:</span> <span id="tip_of_the_day"></span></p>
            <p class="about-meta"><span>&copy; 2014&ndash;2026 Scott Griffiths</span><span>Version <span id="version">2.0</span></span></p>
        </div>
        <div id="sb-site">
            <div id="toolbar" class="toolbar" role="toolbar" aria-label="Clock controls" data-collapsed="false">
                <!-- A row: first the button that tucks the rest away and
                     brings them back, then the clock's face (the rest of
                     the visual settings are the board's, in a menu of its
                     own: #board-control, below), an icon dropping its choices out
                     (created by my-clock.js, which also places them where
                     they fit on the screen); only one is open at a time. A
                     button's accessible name is its setting and current
                     value ("Board: Oak"). The icons (icons.js) are filled in by
                     my-clock.js: a setting's is that of its choice.
                     Choosing a face, a speed, a precision, a background
                     or a board leaves the list open, rather than closing it
                     as most choices do, so several can be tried in a row.
                     Next, the stopwatch, a game replayed, and the gallery:
                     the four tools, one on the board at a time.
                     Along the top of the screen in portrait; down the left in
                     landscape, where the board leaves the sides free. -->
                <button id="menu-toggle" class="button menu-toggle" type="button" title="Hide the controls" aria-label="Hide the controls" aria-expanded="true" aria-controls="toolbar-actions">
                    <span aria-hidden="true"></span>
                </button>
                <div id="toolbar-actions" class="toolbar-actions">
                    <div id="face-control" class="setting-control" data-open="false">
                        <button class="setting-summary" type="button" title="Clock face" aria-label="Clock face" aria-expanded="false" aria-controls="face-options">
                            <span class="setting-icon" aria-hidden="true"></span>
                        </button>
                        <div id="face-options" class="setting-options" role="group" aria-label="Clock face"></div>
                    </div>
                    <!-- The stopwatch (stopwatch.js), on the board instead
                         of the time: the button shows it, and is pressed
                         while it is showing. Start or stop, and reset, open
                         in the row beneath it (#stopwatch-bar, below). It
                         keeps running while another tool has the board. -->
                    <button id="stopwatch" class="setting-summary" type="button" title="Stopwatch" aria-label="Stopwatch" aria-pressed="false" data-info="Stopwatch">
                        <span class="setting-icon" aria-hidden="true"></span>
                    </button>
                    <!-- A game replayed on the board (replay.js), picked at
                         random: the button starts one, and while it runs is
                         pressed instead, and stops it. Play or pause and
                         the game's line open in the row beneath it
                         (#replay-bar, below). -->
                    <button id="replay" class="setting-summary" type="button" title="Replay a game" aria-label="Replay a game" aria-pressed="false" data-info="Replay a game">
                        <span class="setting-icon" aria-hidden="true"></span>
                    </button>
                    <!-- The gallery (gallery.js): pictures made of stones,
                         in a shuffled order, each named on the board's top
                         edge while it is showing. Its controls open in the
                         row beneath it (#gallery-bar, below). -->
                    <button id="gallery" class="setting-summary" type="button" title="Gallery" aria-label="Gallery" aria-pressed="false">
                        <span class="setting-icon" aria-hidden="true"></span>
                    </button>
                </div>
            </div>
            <!-- The board: its own button, a small goban, at the top right
                 of the screen, a menu apart from the toolbar's that works
                 the same way, mirrored: tapped, it turns to a cross and the
                 visual settings of the board rather than the clock (the
                 hand's speed and precision, the table, and the wood) come
                 out leftwards from under it, each dropping its choices
                 beneath; tapped again, or a touch elsewhere, and they go
                 back. Only one of it and the toolbar's row is open at a
                 time. The button stays when the toolbar's row is tucked
                 away, dimming with its toggle. -->
            <div id="board-control" class="board-control" data-open="false">
                <button id="board-toggle" class="button menu-toggle" type="button" title="The board" aria-label="The board" aria-expanded="false" aria-controls="board-actions" data-info="The board">
                    <span aria-hidden="true"></span>
                </button>
                <div id="board-actions" class="board-actions">
                    <div id="placement-control" class="setting-control" data-open="false">
                        <button class="setting-summary" type="button" title="Precision" aria-label="Precision" aria-expanded="false" aria-controls="placement-options">
                            <span class="setting-icon" aria-hidden="true"></span>
                        </button>
                        <div id="placement-options" class="setting-options" role="group" aria-label="Precision"></div>
                    </div>
                    <div id="wood-control" class="setting-control" data-open="false">
                        <button class="setting-summary" type="button" title="Board" aria-label="Board" aria-expanded="false" aria-controls="wood-options">
                            <span class="setting-icon" aria-hidden="true"></span>
                        </button>
                        <div id="wood-options" class="setting-options" role="group" aria-label="Board"></div>
                    </div>
                    <div id="speed-control" class="setting-control" data-open="false">
                        <button class="setting-summary" type="button" title="Speed" aria-label="Speed" aria-expanded="false" aria-controls="speed-options">
                            <span class="setting-icon" aria-hidden="true"></span>
                        </button>
                        <div id="speed-options" class="setting-options" role="group" aria-label="Speed"></div>
                    </div>
                    <div id="background-control" class="setting-control" data-open="false">
                        <button class="setting-summary" type="button" title="Background" aria-label="Background" aria-expanded="false" aria-controls="background-options">
                            <span class="setting-icon" aria-hidden="true"></span>
                        </button>
                        <div id="background-options" class="setting-options" role="group" aria-label="Background"></div>
                    </div>
                    <!-- Not visual settings, any of these: the clock's
                         hours, whether it shows seconds, the sound, and
                         what the clock is. Tucked under one "Tools" button,
                         set apart in the row by a gap, as a row of icons
                         like the face's. The first three are toggles rather
                         than choices, each showing where it stands by its
                         icon and swapping over when tapped, the row left
                         open; about opens the about box instead. -->
                    <div id="tools-control" class="setting-control" data-open="false">
                        <button class="setting-summary" type="button" title="Tools" aria-label="Tools" aria-expanded="false" aria-controls="tools-options" data-info="Tools">
                            <span class="setting-icon" aria-hidden="true"></span>
                        </button>
                        <div id="tools-options" class="setting-options setting-options-row" role="group" aria-label="Tools">
                            <button id="mode" class="choice-button" type="button">
                                <span class="setting-icon" aria-hidden="true"></span>
                            </button>
                            <button id="seconds-toggle" class="choice-button" type="button">
                                <span class="setting-icon" aria-hidden="true"></span>
                            </button>
                            <button id="mute" class="choice-button" type="button">
                                <span class="setting-icon" aria-hidden="true"></span>
                            </button>
                            <button id="about" class="choice-button" type="button" title="About" aria-label="About" aria-expanded="false" aria-controls="about_box" data-info="About">
                                <span class="setting-icon" aria-hidden="true"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- The one place a line of information shows, on the board's
                 top edge in either orientation (my-clock.js places it): a
                 setting as it changes ("Board: Kaya"), or held while its
                 button or choice is, and a replayed game's name and result,
                 under its shelf's icon. -->
            <div id="info" class="info" role="status" aria-live="polite" hidden>
                <span id="info-icon" class="setting-icon" aria-hidden="true"></span>
                <span id="info-text"></span>
            </div>
            <!-- A game being replayed: play or pause, next to where the
                 game has got to, on a line from the first move to the last,
                 which can be dragged to any move. In the row beneath the
                 toolbar's, from under the replay button (or, in landscape,
                 beside it, running down), where my-clock.js places it; comes
                 and goes with the toolbar's own row when that is tucked away
                 or brought back. The game plays at the hand's own speed. -->
            <div id="replay-bar" class="replay-bar" hidden>
                <button id="replay-play" class="setting-summary" type="button">
                    <span class="setting-icon" aria-hidden="true"></span>
                </button>
                <div id="replay-track" class="replay-track" role="slider" tabindex="0" aria-label="Move" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
                    <div class="replay-line"></div>
                    <div id="replay-marker" class="replay-marker"></div>
                </div>
            </div>
            <!-- The stopwatch's controls, as a stopwatch has them: start
                 or stop, and reset, which only a stopped stopwatch can be.
                 Placed and shown as the replay's bar is, while the
                 stopwatch is on the board. -->
            <div id="stopwatch-bar" class="stopwatch-bar" role="group" aria-label="Stopwatch" hidden>
                <button id="stopwatch-start" class="setting-summary" type="button">
                    <span class="setting-icon" aria-hidden="true"></span>
                </button>
                <button id="stopwatch-reset" class="setting-summary" type="button" title="Reset" aria-label="Reset">
                    <span class="setting-icon" aria-hidden="true"></span>
                </button>
            </div>
            <!-- The gallery's controls: back to the picture before, play
                 or pause, and on to the next. Placed and shown as the
                 replay's bar is, while the gallery is on the board. -->
            <div id="gallery-bar" class="gallery-bar" role="group" aria-label="Gallery" hidden>
                <button id="gallery-back" class="setting-summary" type="button" title="Previous picture" aria-label="Previous picture">
                    <span class="setting-icon" aria-hidden="true"></span>
                </button>
                <button id="gallery-play" class="setting-summary" type="button">
                    <span class="setting-icon" aria-hidden="true"></span>
                </button>
                <button id="gallery-next" class="setting-summary" type="button" title="Next picture" aria-label="Next picture">
                    <span class="setting-icon" aria-hidden="true"></span>
                </button>
            </div>
            <!-- role="img": the stones mean nothing to a screen reader, so the
                 board is one picture, whose label my-clock.js keeps as the time,
                 or the stopwatch's. -->
            <div id="goban" role="img" aria-label="Go board clock">
                <img id="goban-image" alt="">
            </div>
        </div>
    </body>
</html>
